<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Finances</title>

<style>
:root{
  --bg:#FFF6EE; --card:#FFFFFF; --ink:#2B2140; --muted:#8C819E; --line:#F2E8EF;
  --pink:#FF7FA3; --blush:#FFE3EB; --mint:#7FD8BE; --butter:#FFD36E; --lilac:#B9A7F5; --peach:#FFB48A;
  --red:#F25F6B; --amber:#F5A623; --green:#2FB98A;
  --display:'Fraunces', Georgia, serif; --body:'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:rgba(255,246,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:-.8px}
.brand b{color:var(--pink);font-weight:800}
main{padding:2px 16px 24px;max-width:640px;margin:0 auto}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--ink);color:#fff}
.btn.pink{background:var(--pink)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(43,33,64,.08)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{color:var(--red)}
.btn.block{display:block;width:100%;padding:15px;margin-top:10px;font-size:16px}
.btn.small{padding:7px 12px;font-size:14px}
.card{background:var(--card);border-radius:26px;padding:18px;margin:14px 0;box-shadow:0 8px 28px rgba(43,33,64,.06)}
h2{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 12px;letter-spacing:-.3px}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:16px 0 8px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.mlabel{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.4px}
.arrow{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(43,33,64,.08);font-size:22px;line-height:1}
.seg{display:flex;background:#F6ECEE;border-radius:999px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 10px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(43,33,64,.08)}
.hero{background:linear-gradient(140deg,#FF8FB0 0%,#FFA98F 60%,#FFC98A 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero .lbl{font-weight:600;opacity:.95}
.big{font-family:var(--display);font-weight:800;font-size:50px;letter-spacing:-1.5px;line-height:1.05;margin:6px 0 8px}
.hero .sum{font-size:14px;opacity:.95}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill{background:#fff;border-radius:20px;padding:12px;box-shadow:0 8px 28px rgba(43,33,64,.06)}
.pill .k{font-size:12.5px;color:var(--muted);font-weight:600}
.pill .v{font-family:var(--display);font-weight:800;font-size:19px;margin-top:2px}
.nudge{display:flex;align-items:center;gap:12px;background:var(--butter);border-radius:20px;padding:14px 16px;margin:14px 0;font-weight:600;border:0;width:100%;text-align:left}
.nudge .e{font-size:22px}
.donutwrap{display:flex;align-items:center;gap:14px}
.legend{flex:1;min-width:0}
.leg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;border:0;background:none;width:100%;text-align:left}
.sw{width:11px;height:11px;border-radius:4px;flex:none}
svg text.dl{font:600 11px var(--body);fill:var(--muted)}
svg text.dv{font:800 17px var(--display);fill:var(--ink)}
svg text.ax{font:600 10px var(--body);fill:var(--muted)}
.bar{height:10px;background:#F5EDF2;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.bline{padding:10px 0;border-bottom:1px solid var(--line)} .bline:last-child{border-bottom:0}
.dot{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:19px;flex:none}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tx:last-child{border-bottom:0}
.tx .d{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:800;white-space:nowrap}
.amt.in{color:var(--green)}
.amt.ign{color:var(--muted);text-decoration:line-through;font-weight:600}
.day{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);margin:18px 2px 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(43,33,64,.06)}
.chip.on{background:var(--ink);color:#fff}
.search{width:100%;border:0;background:#fff;border-radius:16px;padding:13px 16px;margin:6px 0 8px;box-shadow:0 2px 10px rgba(43,33,64,.06);outline:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:0;background:#FFF6EE;border-radius:18px;padding:12px 4px;text-align:center;font-size:13px;font-weight:600}
.cat .e{font-size:24px;display:block;margin-bottom:4px}
.cat.on{background:var(--ink);color:#fff}
.f{display:block;font-weight:600;font-size:14px;margin:12px 0}
.f input,.f select,select.f{display:block;width:100%;margin-top:6px;border:0;background:#FFF6EE;border-radius:14px;padding:13px 14px;outline:none;font-size:16px}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px;margin:14px 0;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--pink)}
.amount-in{display:flex;align-items:center;gap:6px;background:#FFF6EE;border-radius:20px;padding:10px 18px;margin:10px 0}
.amount-in span{font-family:var(--display);font-weight:800;font-size:36px;color:var(--pink)}
.amount-in input{border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:36px;width:100%;outline:none}
.goal .ring{flex:none}
.goal .gname{font-family:var(--display);font-weight:800;font-size:19px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blush);color:#C2416B}
.tag.ok{background:#DDF6EC;color:#1F8A64}
.split-line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.split-line:last-child{border-bottom:0}
.empty{text-align:center;padding:28px 14px}
.empty .e{font-size:44px}
.banks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank{border:0;border-radius:20px;padding:16px 12px;font-weight:700;text-align:left;color:#fff}
.bank small{display:block;font-weight:600;opacity:.85;font-size:12px;margin-top:2px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(43,33,64,.08);border-radius:26px 26px 0 0;z-index:6}
.tabs button{background:none;border:0;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:16px;flex:1;min-width:0}
.tabs .i{font-size:21px;line-height:1.1}
.tabs button.on{color:var(--ink);background:var(--blush)}
#backdrop{position:fixed;inset:0;background:rgba(43,33,64,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#backdrop.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:#fff;border-radius:28px 28px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;z-index:10;max-width:640px;margin:0 auto}
#sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:#E9DFE8;margin:2px auto 12px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:all .25s;z-index:20;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.prev{max-height:220px;overflow:auto;margin-top:8px}
.warnbox{background:#FFF1D6;border-radius:16px;padding:12px 14px;font-size:14px;margin:10px 0}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 28px rgba(43,33,64,.06);border:0;padding:0;text-align:left}
.wimg{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:linear-gradient(140deg,#FFE3EB,#FFF1D6)}
.wph{aspect-ratio:1/1;display:grid;place-items:center;font:800 46px var(--display);color:#C9A0B4;background:linear-gradient(140deg,#FFE3EB,#FFF1D6)}
.wbody{padding:10px 12px 12px}
.wname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wprice{font-family:var(--display);font-weight:800;font-size:18px;margin:2px 0 6px}
.tag.wait{background:#EEE8FF;color:#6A4FD6}
.wbig{width:100%;max-height:340px;object-fit:contain;border-radius:20px;background:#FFF6EE;display:block}
.savedpill{background:linear-gradient(140deg,#7FD8BE,#9AD4EE);color:#fff;border-radius:22px;padding:14px 16px;margin-top:10px}

/* data / spreadsheet style */
table.dt{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.dt th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:6px 6px;border-bottom:1.5px solid #E9DFE7}
.dt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tr:nth-child(even) td{background:#FFFBF8}
.dt .r{text-align:right;white-space:nowrap}
.dt td .sw{display:inline-block;margin-right:6px;vertical-align:middle}
.dt td.db{position:relative;min-width:96px}
.dt td.db i{position:absolute;right:6px;top:6px;bottom:6px;border-radius:5px;max-width:calc(100% - 12px)}
.dt td.db span{position:relative;font-weight:700}
.dt tr.tot td{font-weight:800;border-top:1.5px solid #E9DFE7;border-bottom:0;background:#fff}
.dt tr.sec td{font-family:var(--display);font-weight:600;color:var(--muted);background:#fff;padding-top:14px}
.gridwrap{overflow-x:auto;margin:8px -4px 0;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;font-size:12.5px;min-width:100%}
.grid th{font-size:11px;color:var(--muted);font-weight:700;padding:6px 7px;border-bottom:1.5px solid #E9DFE7;text-align:right;white-space:nowrap}
.grid td{padding:7px 7px;border-bottom:1px solid #fff;white-space:nowrap;border-right:1px solid #fff}
.grid .r{text-align:right}
.grid .stick{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;z-index:1;box-shadow:2px 0 0 #F1E9EF}
.grid tr.tot td{font-weight:800;border-top:1.5px solid #E9DFE7}
.legrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.linkline{display:block;width:100%;text-align:center;border:0;background:#FFF1D6;border-radius:14px;padding:10px;margin:12px 0 0;font-weight:600;font-size:14px}
.coverrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.coverrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink)}
.mini{display:flex;align-items:center;gap:2px;background:#FFF6EE;border-radius:12px;padding:6px 10px;font-weight:700}
.mini input{width:70px;border:0;background:transparent;font-weight:700;font-size:15px;outline:none;text-align:right}
.x{border:0;background:none;color:var(--muted);font-size:15px;padding:4px}
.leg{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
</style>
</head>

function monthDiff(a,b){ const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); }

/* ============ Categorising ============ */
const NOISE = new Set(['card','payment','pos','visa','debit','purchase','contactless','gbp','ltd','limited','www','com','co','uk','gb','the','ref','on','at','via','apple','pay','google']);
function keyOf(desc){
  const w=String(desc).toLowerCase().replace(/[^a-z0-9& ]+/g,' ').split(/\s+/).filter(x=>x && !/\d/.test(x) && !NOISE.has(x));
  return w.slice(0,3).join(' ') || String(desc).toLowerCase().trim();
}
const ruleKey = t => (t.amount<0?'out:':'in:')+keyOf(t.desc);
function matchText(t){ return ' '+(t.desc+' '+(t.ref||'')).toLowerCase().replace(/[^a-z0-9&.\-]+/g,' ')+' '; }
function autoCat(t, rowType){
  const learned = S.rules[ruleKey(t)];
  if(learned && (CAT[learned] || learned==='goals')) return learned;
  if(rowType && /top.?up|exchange|internal transfer|savings goal/i.test(rowType)) return 'transfer';
  if(BANK[t.bank]?.card && t.amount>0 && /payment|thank you/i.test(t.desc)) return 'transfer';
  const txt = matchText(t);
  const dir = t.amount<0 ? 'out' : 'in';
  for(const [cat,d,words] of KW){
    if(d==='in' && dir!=='in') continue;
    if(words.some(w=>txt.includes(w))) return cat;   // a positive amount matching a spending word = refund
  }
  return 'none';
}

/* ============ Maths for months ============ */
function txIn(m){ return S.tx.filter(t=>t.date.startsWith(m)); }
function stats(list){
  const s={inc:0,out:0,aside:0,none:0,byCat:{},bySrc:{}};
  for(const t of list){
    const c=CAT[t.category]||CAT.none;
    if(c.t==='ignore') continue;
    if(c.t==='aside'){ s.aside-=t.amount; continue; }
    if(c.t==='none') s.none++;
    if(c.t==='in' || (c.t==='none' && t.amount>0)){ s.inc+=t.amount; const k=c.t==='in'?c.id:'none'; s.bySrc[k]=(s.bySrc[k]||0)+t.amount; }
    else { s.out-=t.amount; s.byCat[c.id]=(s.byCat[c.id]||0)-t.amount; }
  }
  return s;
}
const monthStats = m => stats(txIn(m));

/* ============ Goals ============ */
const goal = id => S.goals.find(g=>g.id===id);
const goalSaved = g => r2(g.contribs.reduce((a,c)=>a+c.amount,0));
function avgRate(g){ const cut=monthAdd(thisMonth(),-2); return g.contribs.filter(c=>c.date.slice(0,7)>=cut).reduce((a,c)=>a+c.amount,0)/3; }
function goalPlan(g){
  const cm=thisMonth(), target=+g.target||0, saved=goalSaved(g);
  const before=r2(g.contribs.filter(c=>c.date.slice(0,7)<cm).reduce((a,c)=>a+c.amount,0));
  const thisM=r2(saved-before), startRem=Math.max(0,target-before), remaining=r2(Math.max(0,target-saved));
  let need=0, monthsLeft=null, est=null;
  if(target>0 && startRem>0){
    if(g.due){ monthsLeft=Math.max(1,monthDiff(cm,g.due.slice(0,7))); need=startRem/monthsLeft; }
    else if(+g.monthly>0){ need=Math.min(+g.monthly,startRem); }
  }
  need=r2(need);
  if(!g.due && remaining>0){ const rate=+g.monthly>0?+g.monthly:avgRate(g); if(rate>0) est=monthAdd(cm, Math.max(0,Math.ceil(remaining/rate)-(thisM>0?0:1))); }
  return {target,saved,remaining,need,thisM,still:r2(Math.max(0,need-thisM)),monthsLeft,est,done:target>0&&remaining<=0};
}

function donutSvg(rows,total,label){

  const leg=pos.slice(0,6).map(x=>`<div class="leg"><span class="sw" style="background:${x.c.c}"></span><span class="grow">${esc(x.c.name)}</span><b class="num">${money0(x.v)}</b></div>`).join('');

function dailySvg(m){

function stackedSvg(months,top){
  const data=months.map(m=>monthStats(m).byCat);
  const tot=data.map(b=>OUT.reduce((a,c)=>a+Math.max(0,b[c.id]||0),0)+Math.max(0,b.none||0));
  const W=330,H=180,base=H-20,max=Math.max(1,...tot),bw=W/months.length,w=Math.min(18,bw*.6);
  const bars=months.map((m,i)=>{ let y=base, s='';
    const parts=top.map(c=>({c:c.c,v:Math.max(0,data[i][c.id]||0)}));
    const other=tot[i]-parts.reduce((a,p)=>a+p.v,0); parts.push({c:'#D9D2E2',v:Math.max(0,other)});
    parts.forEach(p=>{ const hh=(base-10)*p.v/max; y-=hh; s+=`<rect x="${i*bw+bw/2-w/2}" y="${y}" width="${w}" height="${hh}" fill="${p.c}"/>`; });
    return s+`<text x="${i*bw+bw/2}" y="${H-5}" text-anchor="middle" class="ax">${monthShort(m)[0]}</text>`; }).join('');
  const leg=top.map(c=>`<span class="row" style="gap:5px"><span class="sw" style="background:${c.c}"></span>${esc(c.name)}</span>`).join('')+`<span class="row" style="gap:5px"><span class="sw" style="background:#D9D2E2"></span>Everything else</span>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#EDE4EA"/>${bars}</svg><div class="legrow">${leg}</div>`;

function inOutSvg(months){
  const data=months.map(m=>monthStats(m));
  const W=330,H=170,base=H-20,max=Math.max(1,...data.flatMap(x=>[x.inc,x.out])),bw=W/months.length,w=Math.min(10,bw*.3);

    <div class="legrow"><span class="row" style="gap:5px"><span class="sw" style="background:#7FD8BE"></span>Money in</span><span class="row" style="gap:5px"><span class="sw" style="background:#FF8FAB"></span>Spent</span></div>`;

function gridTable(months,list,key){

  const t=S.tx.find(x=>x.id===id); if(!t) return;

  t.category=cat; let n=0;

/* ============ Split ============ */
function computeSplit(amount){
  let left=r2(amount); const lines=[], missing=[];
  const take=(kind,ref,label,e,where,want)=>{ want=r2(want); if(want<=0) return; const a=r2(Math.min(left,want)); if(a>0){ left=r2(left-a); lines.push({kind,ref,label,e,where,amount:a}); } if(a<want) missing.push({label,amount:r2(want-a)}); };
  (S.covers||[]).filter(c=>c.on).forEach(c=>take('cover',c.id,c.name,'','Your space for it',+c.amount||0));
  const gs=S.goals.map(g=>({g,p:goalPlan(g)})).filter(x=>x.p.still>0);
  gs.filter(x=>x.g.due).sort((a,b)=>a.g.due.localeCompare(b.g.due)).forEach(x=>take('goal',x.g.id,x.g.name,'',x.g.kept||'Savings',x.p.still));
  gs.filter(x=>!x.g.due).forEach(x=>take('goal',x.g.id,x.g.name,'',x.g.kept||'Savings',x.p.still));
  if(left>0) lines.push({kind:'left',ref:'',label:'Left behind',e:'',where:'Stays in your main account',amount:left});
  return {amount:r2(amount),lines,missing};
}
function splitView(){
  const cv=S.covers||[];
  let h=`<div class="mlabel" style="margin:8px 0 2px">Split my income</div>
    <div class="card"><div class="amount-in"><span>£</span><input id="splitAmt" type="number" inputmode="decimal" step="0.01" placeholder="0" value="${splitRes?splitRes.amount:''}"></div>

      <span class="grow"><b>${esc(c.name)}</b></span><span class="mini">£<input type="number" inputmode="decimal" step="0.01" value="${c.amount}" onchange="S.covers[${i}].amount=r2(+this.value||0);save()"></span>

    const grp=(k,t)=>{const ls=splitRes.lines.filter(l=>l.kind===k);return ls.length?`<tr class="sec"><td colspan="2">${t}</td></tr>${ls.map(line).join('')}`:''};
    h+=`<div class="card"><h2>Your ${money(splitRes.amount)}</h2><table class="dt">${grp('cover','Cover first')}${grp('goal','Goals & debt')}${grp('left','Left behind')}</table>

function coverSheet(){

function addCover(){ const n=document.getElementById('cName').value.trim(), a=parseFloat(document.getElementById('cAmt').value);
  if(!n){ toast('Give it a name'); return; } S.covers=S.covers||[]; S.covers.push({id:uid('c'),name:n,amount:r2(a||0),on:true}); save(); closeSheet(); render(); }
function runSplit(){
  const v=parseFloat(document.getElementById('splitAmt').value);
  if(!(v>0)){ toast('Type in an amount first'); return; }

function saveSplit(){
  if(!splitRes) return;
  const id=uid('s'), d=today();
  splitRes.lines.forEach(l=>{ if(l.kind==='goal'){ const g=goal(l.ref); if(g) g.contribs.push({date:d,amount:l.amount,note:'From split',split:id}); } });
  S.splits.push({id,date:d,month:d.slice(0,7),amount:splitRes.amount,source:splitSrc,lines:splitRes.lines.map(l=>({kind:l.kind,ref:l.ref,amount:l.amount,label:l.label}))});

function undoSplit(id){
  S.goals.forEach(g=>g.contribs=g.contribs.filter(c=>c.split!==id));

/* ============ Goals ============ */
function ring(p,color){
  const r=26,C=2*Math.PI*r, f=Math.max(0,Math.min(1,p));
  return `<svg class="ring" width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="${r}" fill="none" stroke="#F5EDF2" stroke-width="8"/>
    <circle cx="33" cy="33" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 33 33)"/>
    <text x="33" y="38" text-anchor="middle" style="font:800 14px var(--display);fill:#2B2140">${Math.round(f*100)}%</text></svg>`;
}
function goalsView(){
  let h=`<div class="row between" style="margin:8px 0 2px"><div class="mlabel">Saving for</div><button class="btn small" onclick="goalSheet('')">＋ New goal</button></div>`;
  for(const g of S.goals){
    const p=goalPlan(g), debt=g.type==='debt', col=debt?'#FF8FAB':'#A78BFA';
    let lines='';
    if(!p.target) lines=`<div class="small muted">Tap Edit to set how much you need.</div>`;
    else {
      lines+=`<div class="small"><b class="num">${money(p.saved)}</b> ${debt?'paid':'saved'} · <b class="num">${money(p.remaining)}</b> ${debt?'left to pay':'to go'}</div>`;
      if(p.done) lines+=`<div style="margin-top:6px"><span class="tag ok">${debt?'Paid off':'Fully saved'}</span></div>`;
      else if(g.due){
        const late=g.due<today();
        lines+=`<div class="small muted" style="margin-top:3px">Due ${fmtDateLong(g.due)} · ${late?'<b style="color:var(--red)">date has passed</b>':p.monthsLeft+' month'+(p.monthsLeft>1?'s':'')+' left'}</div>
          <div class="small" style="margin-top:6px">Save <b class="num">${money(p.need)}</b> a month · ${p.still>0?`<span class="tag">${money(p.still)} still to put aside this month</span>`:'<span class="tag ok">this month done ✓</span>'}</div>`;
      } else {
        lines+= p.est ? `<div class="small muted" style="margin-top:3px">At this rate it'll be ${debt?'cleared':'ready'} around <b style="color:var(--ink)">${monthLabel(p.est)}</b></div>`
                      : `<div class="small muted" style="margin-top:3px">No due date. Add a ${debt?'payment':'top-up'} or set a monthly amount to see when it'll be ${debt?'cleared':'ready'}.</div>`;
        if(p.need>0) lines+=`<div class="small" style="margin-top:6px">${p.still>0?`<span class="tag">${money(p.still)} still to put aside this month</span>`:'<span class="tag ok">this month done ✓</span>'}</div>`;
      }
    }
    h+=`<div class="card goal"><div class="row" style="align-items:flex-start;gap:14px">${ring(p.target?p.saved/p.target:0,col)}
      <div class="grow"><div class="gname">${esc(g.name)}</div>${p.target?`<div class="small muted">${debt?'Owed':'Target'} ${money(p.target)}${g.kept?' · '+esc(g.kept):''}</div>`:''}<div style="margin-top:6px">${lines}</div></div></div>
      <div class="row" style="margin-top:12px;gap:8px">
        <button class="btn small pink" onclick="moneySheet('${g.id}')">${debt?'＋ Add payment':'＋ Add money'}</button>
        <button class="btn small soft" onclick="goalSheet('${g.id}')">Edit</button>
        ${g.repeat && (p.done || (g.due && g.due<today())) ? `<button class="btn small soft" onclick="nextRound('${g.id}')">↻ Start next year</button>`:''}
      </div></div>`;
  }
  return h;
}
let sheetType='save';

function setGType(t){ sheetType=t; document.getElementById('tSave').classList.toggle('on',t==='save'); document.getElementById('tDebt').classList.toggle('on',t==='debt'); document.getElementById('tLbl').textContent=t==='debt'?'Total owed':'Amount needed'; }
function saveGoal(id){

function delGoal(id){ if(!confirm('Delete this goal and its history?')) return; S.goals=S.goals.filter(g=>g.id!==id); save(); closeSheet(); render(); }
function moneySheet(id){

function addMoney(id,sign){
  const a=parseFloat(document.getElementById('mAmt').value); if(!(a>0)){ toast('Type in an amount'); return; }
  goal(id).contribs.push({date:document.getElementById('mDate').value||today(),amount:r2(a*sign),note:''});

function nextRound(id){
  const g=goal(id);
  g.history=(g.history||[]).concat({ended:today(),total:goalSaved(g)});
  g.contribs=[];
  if(g.due){ const [y,m,d]=g.due.split('-'); g.due=(+y+1)+'-'+m+'-'+d; }
  save(); render(); toast('New round started');
}

/* ============ Wishlist ============ */
const waitDays = p => p<20?3 : p<50?7 : p<150?14 : 30;
function addDays(d,n){ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate()); }
function wishStatus(w){
  const end=addDays(w.added,waitDays(+w.price||0)), left=Math.round((new Date(end+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5);
  if(left>0) return {k:'wait',txt:`${left} day${left>1?'s':''} to wait`,left,end};
  return {k:'ready',txt:'Ready ✓',left:0,end};
}
function wishView(){
  const list=S.wish.filter(w=>w.status==='waiting');
  const saved=r2(S.wish.filter(w=>w.status==='dropped').reduce((a,w)=>a+(+w.price||0),0));
  const withSt=list.map(w=>({w,st:wishStatus(w)})).sort((a,b)=>({ready:0,wait:1}[a.st.k]-{ready:0,wait:1}[b.st.k])||a.st.left-b.st.left);
  let h=`<div class="row between" style="margin:8px 0 2px"><div class="mlabel">Wishlist</div><button class="btn small" onclick="wishSheet('')">＋ Add</button></div>`;
  if(saved>0) h+=`<div class="savedpill"><div class="small" style="font-weight:600">Saved by waiting</div><div style="font:800 28px var(--display)">${money(saved)}</div></div>`;
  if(!withSt.length) h+=`<div class="card empty"><h2>Nothing on your wishlist</h2><p class="muted small">Add things you want to buy. The app makes you wait a little first, then tells you when it's ready.</p><button class="btn pink block" onclick="wishSheet('')">Add something</button></div>`;
  else h+=`<div class="wgrid">${withSt.map(({w,st})=>`<button class="wcard" onclick="wishDetail('${w.id}')">${w.img?`<img class="wimg" src="${esc(w.img)}" alt="" onerror="this.outerHTML='<div class=wph>${esc((w.name||'?')[0].toUpperCase())}</div>'">`:`<div class="wph">${esc((w.name||'?')[0].toUpperCase())}</div>`}
      <div class="wbody"><div class="wname">${esc(w.name)}</div><div class="wprice num">${money(+w.price||0)}</div><span class="tag ${st.k==='ready'?'ok':st.k==='wait'?'wait':''}">${st.txt}</span></div></button>`).join('')}</div>`;
  const done=S.wish.filter(w=>w.status!=='waiting').slice().reverse();
  if(done.length) h+=`<div class="card"><h2>History</h2>${done.map(w=>`<div class="split-line"><span class="dot" style="background:${w.status==='bought'?'#DDF6EC':'#EEE8FF'}"></span><span class="grow"><b>${esc(w.name)}</b><div class="tiny muted">${w.status==='bought'?'Bought':'Decided against'} · ${fmtDateLong(w.doneDate)}</div></span><b class="num" style="${w.status==='dropped'?'color:var(--green)':''}">${money(+w.price||0)}</b>
    <button class="btn ghost small" style="margin-left:6px" onclick="delWish('${w.id}')">✕</button></div>`).join('')}</div>`;
  return h;
}
function wishDetail(id){
  const w=S.wish.find(x=>x.id===id), st=wishStatus(w), c=CAT[w.cat];
  const why = st.k==='wait' ? `You added this on ${fmtDateLong(w.added)}. Things around ${money(+w.price)} wait ${waitDays(+w.price)} days, so it's ready on <b>${fmtDateLong(st.end)}</b> if you still want it.`
    : `The wait is over. If you still want it, it's ready.`;
  openSheet(`${w.img?`<img class="wbig" src="${esc(w.img)}" alt="">`:''}
    <div class="row between" style="margin-top:12px"><h2 style="margin:0">${esc(w.name)}</h2><b style="font:800 22px var(--display)">${money(+w.price||0)}</b></div>
    <div class="small muted">${esc(c.name)}</div>
    <div class="warnbox" style="background:${st.k==='ready'?'#DDF6EC':'#EEE8FF'}"><b>${st.txt}</b><br>${why}</div>
    ${w.link?`<a class="btn block soft" style="text-align:center;text-decoration:none;box-sizing:border-box" href="${esc(w.link)}" target="_blank" rel="noopener">Open the link ↗</a>`:''}
    <button class="btn block pink" onclick="wishDone('${id}','bought')">I bought it</button>
    <button class="btn block" style="background:#7FD8BE" onclick="wishDone('${id}','dropped')">I don't want it anymore</button>
    <button class="btn block ghost" onclick="wishSheet('${id}')">Edit</button>`);
}
function wishDone(id,status){ const w=S.wish.find(x=>x.id===id); w.status=status; w.doneDate=today(); save(); closeSheet(); render(); toast(status==='dropped'?`${money(+w.price)} saved`:'Marked as bought'); }
function delWish(id){ S.wish=S.wish.filter(w=>w.id!==id); save(); render(); }
let wishDraft={};
function wishSheet(id){
  const w=id?S.wish.find(x=>x.id===id):{name:'',price:'',link:'',cat:'clothes',img:''};
  wishDraft={id,img:w.img||''};

    <label class="f">Name<input id="wName" value="${esc(w.name)}" placeholder="e.g. Brown abaya"></label>
    <label class="f">Price (£)<input id="wPrice" type="number" inputmode="decimal" step="0.01" value="${w.price||''}"></label>

function wishImgHtml(){ return wishDraft.img?`<img class="wbig" src="${esc(wishDraft.img)}" alt="">`:`<div class="wph" style="border-radius:20px;aspect-ratio:2/1;font-size:15px;color:var(--muted);font-weight:600">No picture yet</div>`; }
async function fetchWishPic(){
  const url=document.getElementById('wLink').value.trim();
  if(!/^https?:\/\//i.test(url)){ toast('Paste the full link first'); return; }
  toast('Looking for the picture…');
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url)); const j=await r.json(), d=j.data||{};
    const img=(d.image&&d.image.url)||(d.logo&&d.logo.url);
    if(d.title && !document.getElementById('wName').value) document.getElementById('wName').value=d.title.slice(0,80);
    if(img){ wishDraft.img=img; document.getElementById('wImgBox').innerHTML=wishImgHtml(); toast('Got it!'); }
    else toast("That shop didn't share a picture. Upload one instead");
  }catch(e){ toast("Couldn't get it. Upload a picture instead"); }
}
document.getElementById('imgFile').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const img=new Image(), u=URL.createObjectURL(f);
  img.onload=()=>{ const k=Math.min(1,600/Math.max(img.width,img.height)), cv=document.createElement('canvas');
    cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    wishDraft.img=cv.toDataURL('image/jpeg',0.75); URL.revokeObjectURL(u); document.getElementById('wImgBox').innerHTML=wishImgHtml(); };
  img.onerror=()=>toast("Couldn't open that picture");
  img.src=u;
});
function saveWish(){
  const name=document.getElementById('wName').value.trim(), price=parseFloat(document.getElementById('wPrice').value);
  if(!name){ toast('Give it a name'); return; } if(!(price>0)){ toast('Add the price'); return; }
  const data={name,price:r2(price),link:document.getElementById('wLink').value.trim(),cat:document.getElementById('wCat').value,img:wishDraft.img||''};
  if(wishDraft.id) Object.assign(S.wish.find(x=>x.id===wishDraft.id),data);
  else S.wish.push({id:uid('w'),added:today(),status:'waiting',...data});
  save(); closeSheet(); render(); toast(wishDraft.id?'Saved':`Added. Wait ${waitDays(price)} days`);
}

      <button class="btn block ghost" onclick="document.getElementById('jsonFile').click()">Restore from a backup</button></div>
    <div class="card"><h2>Learning</h2><p class="small muted" style="margin-top:-4px">The app remembers how you sort shops so it can do it for you next time.</p>
      <p class="small">Remembered: <b>${Object.keys(S.rules).length}</b> · Transactions: <b>${S.tx.length}</b></p>
      <button class="btn block ghost" onclick="resortAll()">Re-sort uncategorised transactions</button>
      <button class="btn block ghost" onclick="if(confirm('Forget everything the app has learned about your shops?')){S.rules={};save();render();toast('Forgotten')}">Forget what it learned</button></div>
    <div class="card"><h2>Start again</h2><button class="btn block ghost danger" onclick="wipe()">Delete all my data</button></div>`;
  return h;
}
function resortAll(){ let n=0; S.tx.forEach(t=>{ if(t.category==='none'){ const c=autoCat(t,''); if(c!=='none'){ t.category=c; n++; } } }); save(); render(); toast(n?`Sorted ${n}`:'Nothing new to sort'); }
function backup(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='finances-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  S.lastBackup=today(); save(); render(); toast('Backup downloaded');
}
document.getElementById('jsonFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d.v||!Array.isArray(d.tx)) throw 0;
    if(!confirm(`Replace what's on this phone with this backup (${d.tx.length} transactions)?`)) return;
    S=Object.assign(blank(),d); save(); render(); toast('Backup restored');
  }catch(err){ toast("That file isn't a backup from this app"); }
});
function wipe(){ if(!confirm('Delete ALL transactions, goals and budgets? This cannot be undone.')) return; S=blank(); save(); render(); toast('All cleared'); }

/* ============ CSV import ============ */
let importBank=null, pending=null;
function openImport(){
  openSheet(`<h2>Import a statement</h2><p class="muted small" style="margin-top:-4px">Download a CSV statement from your banking app first, then choose which bank it's from.</p>
    <div class="banks">${BANKS.map(b=>`<button class="bank" style="background:${b.bg}" onclick="pickBank('${b.id}')">${b.name}<small>${b.sub||'Current account'}</small></button>`).join('')}</div>
    <p class="tiny muted" style="margin-top:14px">Don't worry about overlapping dates. Anything you've already imported is skipped.</p>`);
}
function pickBank(id){ importBank=id; const f=document.getElementById('csvFile'); f.value=''; f.click(); }
document.getElementById('csvFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ handleCsv(await f.text()); }catch(err){ console.error(err); toast("Couldn't read that file"); }
});
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const cnt=ch=>first.split(ch).length;
  const delim=cnt(';')>cnt(',')?';':cnt('\t')>cnt(',')?'\t':',';
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}
function detect(headers){
  const h=headers.map(x=>x.toLowerCase().replace(/\s+/g,' ').trim());
  const find=(...p)=>{ for(const x of p){ const i=h.findIndex(v=>x instanceof RegExp?x.test(v):v===x); if(i>=0) return i; } return -1; };
  const d={
    date:find('transaction date','started date','date','posted date','posting date','completed date',/\bdate\b/),
    desc:find('counter party','counterparty','merchant','merchant name','description','transaction description','details','narrative','payee','name',/description|merchant|details|payee/,'reference'),
    amount:find('amount (gbp)','amount','value','billing amount','transaction amount',/^amount|amount \(|value/),
    out:find('paid out','money out','debit','debit amount','out',/paid out|money out|debit amount/),
    inn:find('paid in','money in','credit','credit amount','in',/paid in|money in|credit amount/),
    dc:find('debit or credit','debit/credit','credit/debit','dr/cr','cr/dr'),
    type:find('type','transaction type'),
    fee:find('fee'), state:find('state','status'),
  };
  const ri=h.indexOf('reference'); d.ref=(ri>=0&&ri!==d.desc)?ri:-1;
  d.cat=find('category','purse category'); d.bank=find('bank');
  if(d.amount>=0){ d.out=-1; d.inn=-1; }
  d.ok = d.date>=0 && d.desc>=0 && (d.amount>=0||d.out>=0||d.inn>=0);
  return d;
}
const sig = r => r.map(x=>x.toLowerCase()).join('|');
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseDate(s){
  s=String(s||'').trim(); let m; const iso=(y,mo,d)=>{ y=+y; if(y<100) y+=2000; if(!(mo>=1&&mo<=12&&d>=1&&d<=31)) return null; return y+'-'+pad2(+mo)+'-'+pad2(+d); };
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)) return iso(m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)) return iso(m[3],+m[2],+m[1]);
  if(m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,4})[A-Za-z]*[\s\-,]+(\d{2,4})/)) return iso(m[3],MON[m[2].toLowerCase()],+m[1]);
  if(m=s.match(/^([A-Za-z]{3,4})[A-Za-z]*\s+(\d{1,2}),?\s+(\d{4})/)) return iso(m[3],MON[m[1].toLowerCase()],+m[2]);
  return null;
}
function parseAmount(s){
  s=String(s??'').trim(); if(!s) return NaN;
  let neg=/^\(.*\)$/.test(s)||/\bDR\b/i.test(s)||/^-|-$|^£?\s*-/.test(s);
  const v=parseFloat(s.replace(/[^0-9.]/g,''));
  if(isNaN(v)) return NaN;
  return neg?-v:v;
}
function handleCsv(text){
  const rows=parseCSV(text);
  if(!rows.length){ toast('That file looks empty'); return; }
  let hi=-1, det=null;
  for(let i=0;i<Math.min(15,rows.length);i++){ const d=detect(rows[i]); if(d.ok){ hi=i; det=d; break; } }
  if(hi<0){ const sv=S.mappings[importBank]; if(sv){ const i=rows.findIndex(r=>sig(r)===sv.sig); if(i>=0){ hi=i; det=sv.map; } } }
  if(hi<0){ mappingSheet(rows); return; }
  readRows(rows,hi,det);
}
function mappingSheet(rows){
  const hi=Math.max(0,rows.findIndex(r=>r.length>=3)); const hdr=rows[hi];
  const sel=(id,label,opt)=>`<label class="f">${label}${opt?' <span class="muted">(optional)</span>':''}<select id="${id}"><option value="-1">—</option>${hdr.map((x,i)=>`<option value="${i}">${esc(x||'Column '+(i+1))}</option>`).join('')}</select></label>`;
  openSheet(`<h2>Help me read this file</h2><p class="small muted" style="margin-top:-4px">I couldn't tell which column is which. Pick them once and I'll remember for ${BANK[importBank].name}.</p>
    ${sel('mDate','Date')}${sel('mDesc','Description / shop')}${sel('mAmt','Amount (if it’s one column)')}${sel('mOut','Money out',1)}${sel('mIn','Money in',1)}
    <button class="btn block pink" onclick="useMapping(${hi})">Carry on</button>`);
  window._mapRows=rows;
}
function useMapping(hi){
  const g=id=>+document.getElementById(id).value;
  const det={date:g('mDate'),desc:g('mDesc'),amount:g('mAmt'),out:g('mOut'),inn:g('mIn'),dc:-1,type:-1,fee:-1,state:-1,ref:-1};
  if(det.date<0||det.desc<0||(det.amount<0&&det.out<0&&det.inn<0)){ toast('Pick the date, description and amount'); return; }
  det.ok=true; S.mappings[importBank]={sig:sig(window._mapRows[hi]),map:det}; save();
  readRows(window._mapRows,hi,det);
}
function readRows(rows,hi,d){
  const out=[];
  for(const r of rows.slice(hi+1)){
    if(d.state>=0 && r[d.state] && !/complet|posted|settled|booked/i.test(r[d.state])) continue;
    const date=parseDate(r[d.date]); if(!date) continue;
    let amt;
    if(d.amount>=0){
      amt=parseAmount(r[d.amount]);
      if(d.fee>=0){ const f=parseAmount(r[d.fee]); if(f) amt-=Math.abs(f); }
      if(d.dc>=0 && r[d.dc]){ const v=r[d.dc].toLowerCase(); if(/^d|dbit|debit/.test(v)) amt=-Math.abs(amt); else if(/^c|crdt|credit/.test(v)) amt=Math.abs(amt); }
    } else {
      const o=d.out>=0?parseAmount(r[d.out]):NaN, i=d.inn>=0?parseAmount(r[d.inn]):NaN;
      amt=(isNaN(i)?0:Math.abs(i))-(isNaN(o)?0:Math.abs(o));
    }
    if(isNaN(amt)||Math.abs(amt)<0.005) continue;
    const desc=(r[d.desc]||'').trim()||(d.ref>=0?r[d.ref]:'')||'Unknown';
    const cname=d.cat>=0?(r[d.cat]||'').trim().toLowerCase():'';
    const fcat=cname?(CATS.find(c=>c.name.toLowerCase()===cname||c.id===cname)||{}).id:undefined;
    const bk=d.bank>=0?(r[d.bank]||'').trim().toLowerCase():'';
    out.push({date,desc,ref:d.ref>=0?(r[d.ref]||''):'',amount:r2(amt),rowType:d.type>=0?(r[d.type]||''):'',fcat,bank:BANK[bk]?bk:undefined});
  }
  if(!out.length){ toast('No transactions found in that file'); return; }
  let flip=false;
  if(BANK[importBank].card && !out.some(t=>t.fcat)){ const pur=out.filter(t=>!/payment|thank you/i.test(t.desc)); flip=pur.length>0 && pur.filter(t=>t.amount>0).length/pur.length>0.6; }
  pending={bank:importBank,raw:out,flip};
  previewSheet();
}
function buildPending(){
  const have=new Set(S.tx.map(t=>t.hash)), seen={}, fresh=[]; let dup=0;
  for(const x of pending.raw){
    const t={id:uid('t'),date:x.date,desc:x.desc,ref:x.ref,amount:pending.flip?-x.amount:x.amount,bank:x.bank||pending.bank};
    const base=[t.bank,t.date,t.amount.toFixed(2),keyOf(t.desc)].join('|');
    seen[base]=(seen[base]||0)+1; t.hash=base+'#'+seen[base];
    if(have.has(t.hash)){ dup++; continue; }
    t.category=x.fcat||autoCat(t,x.rowType); t.fromFile=!!x.fcat; fresh.push(t);
  }
  return {fresh,dup};
}
function previewSheet(){
  const {fresh,dup}=buildPending();
  const dates=pending.raw.map(t=>t.date).sort();
  const none=fresh.filter(t=>t.category==='none').length, tr=fresh.filter(t=>t.category==='transfer').length;
  const st=stats(fresh);
  openSheet(`<h2>${BANK[pending.bank].name}${pending.bank==='history'?'':' statement'}</h2>
    <p class="small muted" style="margin-top:-4px">${fmtDateLong(dates[0])} to ${fmtDateLong(dates[dates.length-1])}</p>
    <div class="pills" style="margin:10px 0"><div class="pill" style="background:#FFF6EE;box-shadow:none"><div class="k">New</div><div class="v">${fresh.length}</div></div>
      <div class="pill" style="background:#FFF6EE;box-shadow:none"><div class="k">Already in</div><div class="v">${dup}</div></div>
      <div class="pill" style="background:#FFF6EE;box-shadow:none"><div class="k">Need sorting</div><div class="v">${none}</div></div></div>
    <p class="small">Money in <b class="num" style="color:var(--green)">${money(st.inc)}</b> · Spent <b class="num">${money(st.out)}</b>${tr?` · ${tr} transfer${tr>1?'s':''} ignored`:''}</p>
    ${BANK[pending.bank].card||pending.flip?`<label class="check"><input type="checkbox" ${pending.flip?'checked':''} onchange="pending.flip=this.checked;previewSheet()"> Purchases show as money in? Flip them</label>`:''}
    <div class="prev">${fresh.slice(0,8).map(t=>{const c=CAT[t.category];return `<div class="tx"><span class="dot" style="background:${c.c}33;width:36px;height:36px;font-size:16px">${c.e}</span><span class="grow"><div class="d small">${esc(t.desc)}</div><div class="s">${fmtDate(t.date)} · ${esc(c.name)}</div></span><span class="amt small num ${t.amount>0?'in':''}">${t.amount>0?'+':'−'}${money(t.amount)}</span></div>`}).join('')}
      ${fresh.length>8?`<p class="tiny muted">…and ${fresh.length-8} more</p>`:''}</div>
    ${fresh.length?`<button class="btn block pink" onclick="commitImport()">Add ${fresh.length} transaction${fresh.length>1?'s':''}</button>`:`<p class="small">Nothing new in this file. It's all already in the app.</p>`}
    <button class="btn block ghost" onclick="closeSheet()">Cancel</button>`);
}
function commitImport(){
  const {fresh}=buildPending();
  // learn from an already-sorted file: most common category per shop
  const votes={};
  fresh.filter(t=>t.fromFile && !['none','goals'].includes(t.category)).forEach(t=>{ const k=ruleKey(t); (votes[k]=votes[k]||{})[t.category]=(votes[k][t.category]||0)+1; });
  Object.entries(votes).forEach(([k,v])=>{ if(!S.rules[k]) S.rules[k]=Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0]; });
  fresh.forEach(t=>delete t.fromFile);
  S.tx.push(...fresh); S.tx.sort((a,b)=>b.date.localeCompare(a.date)); save();
  const none=fresh.filter(t=>t.category==='none').length;
  viewMonth=fresh.map(t=>t.date).sort().pop().slice(0,7); pending=null;
  if(none){ go('settings'); } else go('home');
  toast(`Added ${fresh.length}${none?` · ${none} need a category`:''}`);
}

/* ============ Start ============ */
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
